name: "signalbait_mobile"
description: "A mobile port of SignalBait, an AI-powered message scanner that determines risk."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.1.1
  image_picker: ^1.2.4
  http: ^1.6.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/signalbait_icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "lib/assets/signalbait_icon.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/signalbait_logo.png

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
